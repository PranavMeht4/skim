e `withRetry` when 22:00 arrives can finish about 3–5s into the window. That's acceptable.\n\n**Why step 5 belongs in this change**\n`setInterval` (`scheduler.js:26`) doesn't wait for the async `tick`. Each failing send spends about 3s across 5 attempts. If a tick runs past 30s, the next tick SELECTs the same `sent = 0` rows and sends them again. Quiet hours release a whole timezone's overnight reminders at one 07:00 tick, so 10 failing sends are enough to cause the overlap. The guard: skip a tick while the previous one is still running.\n\n**Step details**\n- **Step 1:** also fix the wrong comment at `scheduler.js:7`. Ship it as its own change, because it moves send times for every user outside UTC.\n- **Step 2:** name the columns `quiet_start` and `quiet_end`, because `end` is a reserved word in SQL. Keep one row per user, which `PUT` replaces. `tick` loads all rows once into a Map; with ≤ 5,000 reminders, that needs no index.\n- **Step 3:** the body is `{ start: \"22:00\", end: \"07:00\", tz: \"Asia/Kolkata\" }`. Return 400 for a bad `HH:mm`, for start == end, or for an unknown zone (`Intl` throws `RangeError`). Routing in `api.js:41-47` matches exact paths, so `/users/:id/quiet-hours` needs matching on both prefix and suffix.\n- **Step 6:**\n  - `scheduler.test.js`: due checks at +330 and −300. The current test uses only offset 0, which hides the bug.\n  - `isQuiet`: 21:59 → no, 22:00 → yes, 06:59 → yes, 07:00 → no. Also a same-day window of 13:00–14:00 and a DST day in `America/New_York`.\n  - `tick`, using `db.reset()` and a capturing `out`: a reminder due 23:00 is held at 23:00 and 03:00 and sent at the first tick at or after 07:00. A user with no settings is unaffected. Deleting settings mid-window releases on the next tick.\n  - Two ticks running at once produce **one** send.\n  - API: `PUT`/`GET`/`DELETE`, plus each 400 case.\n","lines":51,"tokens":1387,"factsFull":3,"factsTop":3},"skim031":{"text":"**Plan: check quiet hours at send time.** During the window the scheduler skips the user's due reminders. The first tick after 07:00 sends them.\n\n1. **Fix the timezone bug first** (`scheduler.js:9`). The offset is applied twice, so reminders already fire at the wrong time.\n2. **Storage:** add a `quiet_hours` table `{ user_id, start, end, tz }` to `db.js`.\n3. **Check:** add a pure `isQuiet(setting, nowMs)` in a new `src/quiet.js`. It handles windows that cross midnight.\n4. **Scheduler:** in `tick`, skip quiet users **before** `withRetry`, and send in `due_ms` order.\n5. **Overlap guard:** stop a new tick from starting while the last one is running (`scheduler.js:26`). Without it the 07:00 burst can double-send.\n6. **API:** add `PUT`/`GET`/`DELETE /users/:id/quiet-hours` in `api.js`, with validation.\n7. **Tests and README:** new `test/quiet.test.js`, plus additions to the scheduler and API tests.\n\n**Not verified:** I confirmed step 1 by reading the code and doing the arithmetic. I didn't run anything, because the command to run it and the tests needed approval.\n\n**Also:**\n- **SQL injection** in `searchReminders`: `q.userId` and `q.q` are pasted into the SQL string (`api.js:30-31`).\n- Quiet-hours settings will be **lost on restart**, the same as reminders (`README.md:16`).\n\n---\n\n**1. Double timezone shift.** `api.js:8` already stores `due_ms` as UTC, and `README.md:37` agrees. `scheduler.js:9` subtracts the offset a second time, and the comment at `:7` is wrong.\n- A 09:00 IST reminder is stored as 03:30Z. It fires at 03:30Z − 5h30 = **22:00Z the day before**, which is **5.5h early**.\n- US Eastern (−300) fires **5h late**.\n- The tests miss it because `scheduler.test.js:6` uses offset 0.\n- Fix: `!r.sent && r.due_ms \u003c= nowMs`. Add tests with offsets 330 and −300.\n\nThe quiet-hours math reads local time from the same data, so its tests would look wrong until this is fixed.\n\n**2. Storage.** There is no users table. `db.js:37-66` only parses statements on `reminders`.\n- Add branches for: upsert by `user_id`, `SELECT * FROM quiet_hours` (all rows, and `WHERE user_id = ?`), and `DELETE … WHERE user_id = ?`.\n- Clear the new table in `reset()`.\n- Example row: `{ user_id: 'u1', start: '22:00', end: '07:00', tz: 'Asia/Kolkata' }`.\n\n**Timezone:** I recommend an **IANA zone stored with the setting**, not `tz_offset_min`.\n- `tz_offset_min` belongs to each reminder, not to the user.\n- A fixed offset doesn't follow daylight saving. For half the year a \"22:00\" window would start at 21:00 or 23:00.\n- Node 20's `Intl` handles IANA zones with no dependencies.\n- If clients can only send an offset, accept `tzOffsetMin` as a fallback and document that it ignores daylight saving.\n\n**3. The check (`src/quiet.js`).**\n- `localMinutes(nowMs, tz)`: call `Intl.DateTimeFormat` with `{ timeZone: tz, hour, minute, hourCycle: 'h23' }`, then `formatToParts`, giving `h*60 + m`. Use `hourCycle: 'h23'`, because `hour12: false` can return `24` at midnight. Cache one formatter per zone.\n- If `start \u003c end`, it's quiet when `start \u003c= t && t \u003c end`.\n- If `start > end` (crosses midnight), it's quiet when `t >= start || t \u003c end`.\n- Start is inclusive and end is exclusive: 22:00 is quiet, 07:00 is not.\n- If `start == end`, the API rejects it, since it could mean \"off\" or \"all day\".\n\n**4. Scheduler.**\n```\nunsent ─► dueReminders ─► sort by due_ms ─► isQuiet(user)? ─yes─► skip (sent stays 0)\n                                                         └─no──► withRetry(send) ─► sent = 1\n```\n- Load every `quiet_hours` row once per tick into a `Map` keyed by `user_id`. That's cheap at ≤5,000 reminders.\n- Run the check before `withRetry`, so a held reminder doesn't use up retries or get logged as `failed`.\n- Held reminders go out **at most 30s** after the window ends (`tickSeconds`).\n- **Why not at create time:** shifting `due_ms` when a reminder is created would lock in the setting. A user who later changes or clears their quiet hours would still get those reminders late. Checking at send time applies changes on the next tick, and `at`/`due_ms` keep the time the user picked.\n- No formatter change is needed. Both formats include `at`, so a held reminder still shows its original time (`format.js:3`, `legacy.js:4`).\n\n**5. Overlap guard.** `setInterval` doesn't wait for `tick` to finish.\n- At 07:00, every held reminder goes out in a single tick.\n- A send that keeps failing waits about **3s** between its 5 attempts (200+400+800+1600 ms). About 10 of those use up the 30s tick.\n- The next tick then re-reads `sent = 0` rows, including ones still being sent, which leads to **double sends**.\n- Fix: an in-memory `running` flag that skips a tick while the previous one is still running. That's enough because there is only one process (`README.md:14`).\n\n**6. API.**\n- `PUT /users/:id/quiet-hours` with body `{ start, end, tz }` returns 200.\n- `GET` returns 200, or 404 if none is set.\n- `DELETE` returns 204.\n- It returns 400 when:\n  - a time isn't `HH:mm` in range: `/^([01]\\d|2[0-3]):[0-5]\\d$/`\n  - the zone is invalid: `new Intl.DateTimeFormat('en-US', { timeZone })` throws `RangeError`\n  - `start == end`\n- Use `?` parameters only. Don't copy the string-built SQL from `searchReminders`.\n\n**7. Tests.**\n- `quiet.test.js`:\n  - 22:00–07:00 checked at 21:59, 22:00, 03:00, 06:59 and 07:00\n  - a window that doesn't cross midnight, e.g. 13:00–14:00\n  - `Asia/Kolkata`\n  - a daylight-saving case: in `America/New_York`, 22:00 local is 03:00Z in winter and 02:00Z in summer\n- `scheduler.test.js`:\n  - offsets 330 and −300 fire on time\n  - a reminder due at 23:00 local is still held at 06:59 and sent at 07:00\n  - users without quiet hours are unaffected\n  - clearing quiet hours releases held reminders on the next tick\n  - a tick that starts while another is running is skipped\n- `api.test.js`: set, get and clear, plus 400s for `25:00`, `Mars/Olympus` and `start == end`.\n- README: add the `quiet_hours` fields and routes. Fix the comment at `scheduler.js:7`.\n\nSteps 1 and 5 fix bugs that exist today, so they can ship on their own first.\n","lines":88,"tokens":1730,"factsFull":3,"factsTop":3},"skim04":{"text":"**Hold due reminders in `tick` while the user's local clock is in quiet hours.**\n- ⛔ **Fix first:** the offset is applied twice, so IST reminders fire 5.5h early (`src/scheduler.js:9`)\n- **Store + API:** a per-user `quiet_hours` table and `PUT/GET/DELETE /quiet-hours` routes\n- **Hold:** `tick` skips users who are quiet now; the first tick after 07:00 sends them (`src/scheduler.js:14`)\n- **Also:** search builds SQL by joining strings, so it can be injected (`src/api.js:31`)\n- ❓ **Needs you:** should quiet hours use an IANA zone (handles DST, my pick) or a fixed offset like reminders do?\n\n───\n\n**Not verified by running.** I tried to run node to confirm the offset bug, but the command needed approval and this session can't grant it. The bug claim comes from reading the code and doing the math. I did not run the test suite.\n\n**Step 0: fix the double offset (blocks everything else)**\n- `toUtcMs` already stores `due_ms` as UTC (`src/api.js:8`), and the README agrees (`README.md:37`).\n- `dueReminders` then subtracts `tz_offset_min` a second time.\n- Example: an IST 09:00 reminder has `due_ms` = 03:30Z. It fires at 22:00Z the day before, which is 03:30 IST. A UTC−5 user's reminder fires 5h late.\n- The tests only use offset 0 (`test/scheduler.test.js:6`), so they still pass.\n- Quiet hours would partly hide this bug: the 03:30 IST send would be held until 07:00, which looks almost right.\n- Fix: compare `r.due_ms \u003c= nowMs`, correct the comment, and add a test at offset 330.\n\n**Design: hold when sending, not when creating**\n\n```\ntick(now)\n  rows = SELECT * FROM reminders WHERE sent = 0\n  qh   = SELECT * FROM quiet_hours        -> Map by user_id (≤5,000 rows)\n  for r in dueReminders(rows, now)        (due_ms \u003c= now, sorted by due_ms)\n     isQuietAt(now, qh.get(r.user_id)) ?\n        yes -> skip; stays sent=0; checked again next tick\n        no  -> send, mark sent\n```\n\nThis design has five advantages:\n- It adds no reminder columns, migration or queue, which fits the README's no-new-infra rule.\n- Changing or removing quiet hours takes effect on the next tick.\n- A reminder that failed before 22:00 and is still unsent is held too.\n- \"Sent after the window ends\" comes for free: it goes out at most 30s after 07:00.\n- `dueReminders` stays pure. The quiet check is a separate pure function.\n\n**Steps**\n1. **`src/quiet.js` (new):**\n   - `parseHHmm(\"22:00\") → 1320`\n   - `localMinuteOfDay(nowMs, timeZone)` using `Intl.DateTimeFormat` with `hourCycle: 'h23'` (built into Node 20, no new dependency)\n   - `isQuietAt(nowMs, qh)`\n2. **`src/db.js`:**\n   - Add `quiet_hours` rows `{ user_id, start_min, end_min, time_zone }`.\n   - Support an upsert, `SELECT` with and without `WHERE user_id = ?`, and `DELETE`.\n   - Clear the table in `reset()`.\n   - Today's `DELETE` and `SELECT` patterns only match the `reminders` table.\n3. **`src/api.js`:**\n   - Follow the existing style, with `userId` in the body or query, and parameterized queries only.\n   - `PUT /quiet-hours` takes `{ userId, start, end, timeZone }` and returns 200.\n   - `GET /quiet-hours?userId=` returns 200, or 404 if none is set.\n   - `DELETE /quiet-hours?userId=` returns 204, or 404.\n   - Validation returns 400 for: missing fields, times that aren't `HH:mm` from 00:00 to 23:59, `start === end` (it's unclear whether that means no window or a 24h one), and a bad zone (`Intl` throws `RangeError`).\n4. **`src/scheduler.js`:**\n   - Do the step 0 fix and the skip shown above.\n   - Sort due reminders by `due_ms` so the 07:00 batch goes out in the order they were due.\n   - Add a `running` flag in `startScheduler` so a tick never starts while the last one is still running.\n5. **`README.md`:** document the new table and routes.\n\n**Why the `running` guard matters now.** `setInterval` doesn't wait for the async `tick` to finish. `withRetry` with 5 attempts adds about 3s of backoff for each failing reminder. Ten failing sends can therefore push a tick past 30s. The next tick then reads the same `sent = 0` rows and sends them twice. That risk exists today, but quiet hours bunch every held reminder into the tick right after 07:00.\n\n**Edge cases**\n\n| Case | Behavior |\n|---|---|\n| 22:00–07:00 (wraps midnight) | quiet if minute ≥ 1320 or \u003c 420 |\n| 13:00–15:00 (same day) | quiet if 780 ≤ minute \u003c 900 |\n| exactly 22:00 / 07:00 | held / sent (window is half-open) |\n| no settings for user | never held |\n| reminder set for 23:00 on purpose | held until 07:00, as you asked |\n| DST change | IANA zone: correct. Fixed offset: 1h off until the user updates it |\n| tick straddles 22:00 | can send up to about 30s into the window; accepted |\n\n**Tests**\n- `test/quiet.test.js` (new): window edges, wrap vs same-day, and a DST date (America/New_York, 2026-03-08).\n- `test/scheduler.test.js`: the IST regression, plus a `tick` test using `{ formatter: 'format', out }`. Held at 23:00, sent at 07:00, not held at 21:59.\n- `test/api.test.js`: PUT valid, the 400 cases, GET and DELETE.\n\n**If you pick a fixed offset instead:** store `tz_offset_min` on `quiet_hours` and compute the local minute arithmetically. It's simpler, but it shares the reminders' DST weakness. Don't reuse each reminder's own `tz_offset_min`: one user could then end up with different windows on different reminders.\n\n**Out of scope, noted:**\n- Settings live in the in-memory db, so they are lost on restart like reminders (`README.md:16`).\n- The create response doesn't say when a held reminder will really go out. That's an easy follow-up.\n- Sending one digest instead of separate messages at 07:00 isn't planned.\n\n```\nsrc/quiet.js            new   parseHHmm, localMinuteOfDay, isQuietAt\nsrc/scheduler.js              offset fix, quiet skip, sort, running guard\nsrc/db.js                     quiet_hours upsert/select/delete, reset\nsrc/api.js                    PUT/GET/DELETE /quiet-hours + validation\nREADME.md                     quiet_hours fields and routes\ntest/quiet.test.js      new\ntest/scheduler.test.js        IST regression, hold/release via tick\ntest/api.test.js              quiet-hours routes\n```\n","lines":97,"tokens":1730,"factsFull":3,"factsTop":2}}},{"id":"safe-delete-legacy","prompt":"Is it safe to delete src/legacy.js?","facts":3,"answers":{"default":{"text":"No, it isn't safe to delete it yet. `src/legacy.js` is the formatter running in production right now. Nothing imports it by name, so a search for imports makes it look unused.\n\n**Why it's still live:**\n- `src/notify.js:8` loads formatters by name at runtime: `` import(`./${name}.js`) ``.\n- `config.json:3` sets `\"formatter\": \"legacy\"`, and `src/index.js:6` passes that through `startScheduler` into `send()`.\n- `src/notify.js:14` also uses `'legacy'` as the default when no formatter is given.\n\n**What would happen if you deleted it:** every `send()` would fail because the import can't find the file. `withRetry` would try 5 times and then `scheduler.js:20` would log `reminder N failed`. Each reminder would stay unsent and be retried on every tick. The process wouldn't crash, so nothing would look wrong except a stream of error logs, and no reminders would go out.\n\n**The tests won't catch this.** The only `send()` test (`test/notify.test.js:8`) passes `formatter: 'format'`, and nothing exercises `legacy`. The suite would stay green after you delete the file.\n\n**To remove it safely:**\n1. Check that whatever reads these messages can handle the new format. The TODO in the file says to wait until \"everyone is on the new format\", and only you can confirm that.\n2. Change `config.json` to `\"formatter\": \"format\"` and deploy. Watch for errors.\n3. Change the default in `src/notify.js:14` to `'format'`.\n4. Delete `src/legacy.js` and remove its line from `README.md:28`.\n\nI haven't changed anything. I can make steps 2–4 if you confirm the readers have moved to the new format.\n","lines":19,"tokens":453,"factsFull":3,"factsTop":3},"concise":{"text":"No, it isn't safe to delete. Nothing imports `src/legacy.js` by name, but it's loaded at runtime and it's the format production uses right now:\n\n- `config.json:3` sets `\"formatter\": \"legacy\"`. `src/index.js:6` passes that value to the scheduler, and `src/notify.js:8` loads it with `import(`./${name}.js`)`.\n- `src/notify.js:14` also uses `'legacy'` as the default when no formatter is passed.\n\nIf you delete it, every reminder send fails with a module-not-found error. `src/scheduler.js:16` retries 5 times, and the reminder still isn't delivered. The tests won't catch this, because `test/notify.test.js` only uses `formatter: 'format'`.\n\nTo retire it safely:\n1. Change `config.json` to `\"formatter\": \"format\"`.\n2. Change the default in `src/notify.js:14` to `'format'`.\n3. Make sure whatever reads these messages handles the new format. The TODO in the file (\"once everyone is on the new format\") says some consumers may still expect the pipe-delimited `REMIND|user|at|text`.\n4. Delete the file and remove its line from `README.md:28`.\n","lines":13,"tokens":297,"factsFull":3,"factsTop":3},"skim":{"text":"**No, not yet.** Production loads it by name, so grepping for `legacy.js` finds nothing.\n\n```\nconfig.json:3        \"formatter\": \"legacy\"\n  → index.js:6       startScheduler({ formatter: config.formatter })\n  → scheduler.js:16  send(r, opts)\n  → notify.js:8      await import(`./${name}.js`)   → ./legacy.js\n```\n\n`notify.js:14` also uses `'legacy'` as the default formatter.\n\n**If you delete it now,** every send fails with a module-not-found error. Each one is retried 5 times (`scheduler.js:16`), then caught and only logged (`scheduler.js:20`). The service keeps running, but **no reminders are delivered**, and they pile up unsent.\n\n**Tests won't catch this.** `test/notify.test.js:8` only exercises `formatter: 'format'`.\n\n**To remove it safely:**\n1. Set `config.json:3` to `\"formatter\": \"format\"`.\n2. Change the default at `notify.js:14` to `'format'`.\n3. Remove the line at `README.md:28`.\n4. Delete `src/legacy.js`.\n\n⚠ **Risk:** Step 1 changes what the service outputs. The old format is `REMIND|u1|\u003cat>|\u003ctext>`; the new one is `Reminder for u1: \u003ctext> (set for \u003cat>)`. The TODO at `legacy.js:2` says to remove the file \"once everyone is on the new format\", so something downstream may still parse the pipe format. The repo can't tell me whether those consumers have moved, so check with them first.\n\n**Not verified:** I didn't run the deletion, even on a temp copy, because that command was blocked. The failure above is read from the code, not observed.\n","lines":25,"tokens":418,"factsFull":3,"factsTop":2},"skim031":{"text":"**No, don't delete it. `src/legacy.js` is the live production formatter.**\n\n- `config.json:3` sets `\"formatter\": \"legacy\"`, and `src/index.js:6` passes that value into the scheduler.\n- `src/notify.js:8` loads the formatter with `` import(`./${name}.js`) ``. That's why grep finds no `import ... from './legacy.js'` anywhere: the file name is built at runtime.\n- `src/notify.js:14` also uses `'legacy'` as the default when no formatter is given.\n\n**If you delete it:** every send fails with a module-not-found error. `withRetry` tries 5 times (about 3s per reminder), then `scheduler.js:18-20` logs the error and leaves the reminder unsent. That happens again on every 30s tick, so **no reminder is ever delivered**.\n\n**Tests won't catch it.** `test/notify.test.js:8` uses `formatter: 'format'`, so nothing exercises `legacy`.\n\n**Safe way to remove it:**\n1. Set `\"formatter\": \"format\"` in `config.json:3`, if consumers accept the new message format. The file's TODO says they may not all be on it yet (\"remove once everyone is on the new format\").\n2. Change the default in `notify.js:14` to `'format'`.\n3. Delete `src/legacy.js` and its line in `README.md:28`.\n\n**Not verified:** I didn't run the tests or try the delete on a scratch copy, because both commands were blocked by the permission prompt. All of the above comes from reading the code.\n\n**Also:**\n- **SQL injection** in search: `q.userId` and `q.q` are pasted straight into the SQL string (`src/api.js:31`).\n- **Timezone applied twice:** `api.js:8` already converts `due_ms` to UTC, then `scheduler.js:9` subtracts the offset again. IST reminders fire **5.5h early**.\n","lines":21,"tokens":465,"factsFull":3,"factsTop":3},"skim04":{"text":"**No. Production still uses it, through a dynamic import that grep can't see.**\n- **Live config:** `config.json` sets `\"formatter\": \"legacy\"` (config.json:3)\n- **Loaded by name:** `notify.js` runs `import(\\`./${name}.js\\`)`, so no static import shows up (src/notify.js:8)\n- **Default too:** `send()` falls back to `'legacy'` when no formatter is passed (src/notify.js:14)\n- **Silent break:** if you delete it, every send throws and gets caught, so no reminder is ever sent\n- **Tests won't catch it:** the only notify test uses `formatter: 'format'` (test/notify.test.js:8)\n\n───\n\n**What happens if you delete it now**\n\n```\nindex.js → startScheduler({ formatter: \"legacy\" })\n  → tick → withRetry(send, 5 attempts)\n    → import(\"./legacy.js\") fails ×5 (backoff ~0.2s → 3.2s)\n      → catch logs \"reminder \u003cid> failed: Cannot find module ...\"\n        → row stays sent = 0 → retried on every tick, forever\n```\n\nThe process stays up and the only symptom is error lines in the log. No reminders go out.\n\n**To remove it safely**\n1. Change `config.json:3` to `\"formatter\": \"format\"`.\n2. Change the default at `src/notify.js:14` to `'format'`.\n3. Delete `src/legacy.js` and its line in `README.md:28`.\n\n**Not verified:** the file's TODO says \"remove once everyone is on the new format.\" That points to downstream consumers that parse the pipe-delimited `REMIND|user|at|text` string. Nothing in this repo shows who they are or whether they've moved to the new format. Check with them before switching the config.\n","lines":28,"tokens":429,"factsFull":3,"factsTop":3}}},{"id":"jitter-correct","prompt":"Why does retry.js add jitter, and is its implementation right?","facts":4,"answers":{"default":{"text":"The jitter is there for a good reason, but the implementation is broken: in the default setup it often removes the backoff it's meant to randomize.\n\n**Why it's there.** The comment in `src/retry.js` gives the reason, and it's sound. If a downstream outage makes many reminder sends fail at once, they would all retry on the same 200 ms → 400 ms → … schedule. That sends synchronized bursts at the service just as it tries to recover (a \"thundering herd\"). Random jitter spreads those retries out.\n\n**What's wrong.** `src/retry.js:8` adds a fixed ±500 ms, no matter how large the delay is:\n\n```js\nconst jitter = (Math.random() - 0.5) * JITTER_MS;   // uniform in [-500, 500)\n```\n\nWith the default `baseMs = 200`:\n\n| Attempt | Base delay | Actual delay range | Chance the delay is ≤ 0 |\n|---|---|---|---|\n| 0 | 200 | -300 … 700 | ~30% |\n| 1 | 400 | -100 … 900 | ~10% |\n| 2+ | 800+ | always positive | 0% |\n\nThe default `attempts = 3` means only attempts 0 and 1 ever wait before retrying (`attempt \u003c attempts - 1`). So both waits in the default config are affected; this isn't an edge case. Node's `setTimeout` turns any delay below 1 ms into 1 ms, so every negative draw becomes an immediate retry. Those retries all land at the same moment, which is the synchronized burst jitter was supposed to prevent, and they skip the backoff entirely.\n\nTwo smaller problems:\n- **The cap isn't a cap.** The jitter is added after `Math.min(maxDelayMs, …)`, so a delay can reach about 10,500 ms.\n- **The spread is weakest where it matters most.** At the 10 s cap, ±500 ms is only ±5%, so clients that have backed off all the way still retry almost together.\n\n**Why the tests don't catch it.** `test/retry.test.js:6` sets `Math.random` to always return 0.5, which makes the jitter exactly 0. Nothing tests `backoffDelay` directly, so the tests only check how many times it retries, not how long it waits.\n\n**Suggested fix.** Make the jitter proportional to the delay and keep the result within the cap. I'd use \"full jitter\" (a random delay anywhere between 0 and the backoff). It spreads retries evenly instead of piling some up at zero:\n\n```js\nexport function backoffDelay(attempt, { baseMs = 200, maxDelayMs = 10_000 } = {}) {\n  const exp = Math.min(maxDelayMs, baseMs * 2 ** attempt);\n  return Math.random() * exp;   // uniform in [0, exp), never negative, never above the cap\n}\n```\n\nIf you want every retry to wait at least some time, use \"equal jitter\" instead: `exp / 2 + Math.random() * (exp / 2)`. Either way, `JITTER_MS` goes away. I'd also add a `backoffDelay` test that sets `Math.random` to `0` and then to `0.999` and checks the result stays between `0` and `maxDelayMs`.\n\nI couldn't run a quick sampling script because the command needed approval, so the percentages above are worked out by hand from the formula. I haven't changed any files. Say if you want me to apply the fix and add the test.\n","lines":39,"tokens":828,"factsFull":4,"factsTop":1},"concise":{"text":"**Why:** to avoid a thundering herd. If a downstream outage makes many reminder sends fail at once, plain exponential backoff has them all retry at the same moments (200 ms, 400 ms, …), which hits the recovering service in synchronized bursts. Random jitter spreads those retries out. The comment at `src/retry.js:2` says the same.\n\n**Is it right?** Partly. It adds randomness, but the jitter is a fixed ±500 ms (`src/retry.js:8`) that doesn't scale with the backoff, which causes three problems:\n\n1. **Delays go negative early on, so retries fire immediately.** With the defaults, attempt 0 is `200 ± 500` ms, a range of −300 to 700 ms. Node treats any delay under 1 ms as 1 ms, so about 30% of first retries happen immediately and about 10% of second retries do. That bunches retries at zero, which is the opposite of what jitter is for.\n2. **Jitter swamps the backoff early and barely matters late.** At 200 ms it's ±250%, so the exponential curve is mostly noise. At the 10 s cap it's only ±5%, so clients that keep failing stay closely synchronized.\n3. **`maxDelayMs` isn't really a maximum.** Adding jitter after the cap can push the delay to 10.5 s.\n\nThe usual fix is \"full jitter\" (from the AWS backoff article): pick a random delay between 0 and the backoff value. It scales with the backoff, is never negative, and never goes over the cap:\n\n```js\nexport function backoffDelay(attempt, { baseMs = 200, maxDelayMs = 10_000 } = {}) {\n  const exp = Math.min(maxDelayMs, baseMs * 2 ** attempt);\n  return Math.random() * exp;\n}\n```\n\nIf you want a guaranteed minimum wait, use \"equal jitter\" instead: `exp / 2 + Math.random() * exp / 2`.\n\nExisting tests should still pass with either version. They mock `Math.random` to return 0.5 (`test/retry.test.js:6`), so the delay just becomes half the backoff instead of the full backoff, but the \"no jitter\" comment there would then be wrong. No test currently checks the delay itself, which is why these problems went unnoticed. I can apply the fix and add a `backoffDelay` test if you want.\n","lines":21,"tokens":582,"factsFull":4,"factsTop":4},"skim":{"text":"**Jitter stops many failed sends from retrying in lockstep, but this version is wrong.**\n\nIt adds a **fixed ±500 ms** (`retry.js:4,8`) instead of scaling with the backoff:\n1. **Negative delays.** `200 − 500 = −300 ms`. Node runs a negative `setTimeout` after about 1 ms, so the retry is effectively **immediate**.\n2. **Default config is mostly noise.** With `attempts = 3`, only retries at attempt 0 and 1 sleep. Their delays are **[−300, 700)** and **[−100, 900)**, so **30%** and **10%** of them fire at once.\n3. **Weak spread at long delays.** At the 10 s cap, ±500 ms is only ±5%, so retries stay bunched.\n4. **Can exceed `maxDelayMs`**, up to **10 500 ms**.\n\n**Fix:** use \"full jitter\": a random delay between 0 and the backoff, which also keeps it within the cap.\n```js\nconst exp = Math.min(maxDelayMs, baseMs * 2 ** attempt);\nreturn Math.random() * exp;\n```\n\n**Also:**\n- No test exercises the jitter. `test/retry.test.js:6` fixes `Math.random` to 0.5, which makes jitter exactly 0, and nothing tests `backoffDelay` directly.\n- With full jitter, 0.5 gives `exp / 2` instead of \"no jitter\", so the comment on that line would need updating.\n\nI didn't run anything: the numbers come from reading the code, because running the sampling script and test suite was denied.\n","lines":20,"tokens":363,"factsFull":4,"factsTop":4},"skim031":{"text":"**Jitter keeps many failed sends from all retrying at the same moment. The current implementation gets it wrong.**\n\n**Why it's there** (`src/retry.js:2`): if a provider outage fails 1,000 reminders at once, plain backoff retries all 1,000 at exactly +200ms, then +400ms. The recovering provider gets hit in waves. Random offsets spread that load out.\n\n**Is it right: no.** `src/retry.js:8` adds a **fixed ±500ms** no matter how long the delay is:\n1. **Negative delays:** the first retry waits 200 ± 500, so −300 to 700ms. **30%** of first retries come out ≤0. Node raises those to 1ms, so they all fire together, which is the very thing jitter should prevent. For the second retry it's **10%**.\n2. **The noise drowns out the backoff:** with the default `attempts = 3`, only those two waits ever run (200 and 400ms). ±500ms is bigger than both, so the second wait can be shorter than the first.\n3. **The spread is too narrow at the cap:** at 10s, ±500ms is only ±5%, so long retries still bunch up.\n4. **It goes over `maxDelayMs`:** jitter is added after the cap is applied, so a wait can reach 10,500ms. This only happens with `attempts ≥ 8`.\n\n**Fix: full jitter.** Pick a random wait between 0 and the capped delay:\n```js\nexport function backoffDelay(attempt, { baseMs = 200, maxDelayMs = 10_000 } = {}) {\n  const exp = Math.min(maxDelayMs, baseMs * 2 ** attempt);\n  return Math.random() * exp;\n}\n```\nWith this, waits are never negative, never over the cap, and the spread grows with the delay. `JITTER_MS` can go. If you want a minimum wait, \"equal jitter\" works too: `exp / 2 + Math.random() * exp / 2`.\n\n**Not run:** the percentages come from the formula, not a measurement. My command to measure them and run `node --test` was denied, so I ran neither.\n\n**Also:**\n- The tests never call `backoffDelay` directly. They also pin `Math.random = 0.5`, which makes this jitter zero, so they can't catch any of the above.\n- After the fix, the `// no jitter` comment at `test/retry.test.js:6` becomes wrong, because 0.5 would mean half the delay. The tests would still pass, since they use `baseMs: 1`.\n- Today `baseMs: 1` still waits up to about 500ms, because `JITTER_MS` doesn't scale with the delay. The fix removes this.\n","lines":26,"tokens":635,"factsFull":4,"factsTop":3},"skim04":{"text":"**No. Adding jitter is right, but a fixed ±500 ms breaks it.**\n- **Why:** it stops failing sends from all retrying at the same moment (`src/retry.js:2`)\n- ⛔ **Negative delays:** 30% of 1st retries and 10% of 2nd fire at ~1 ms (`src/retry.js:8`)\n- ⚠ **Not scaled:** ±500 ms is ±250% of a 200 ms delay but only ±5% at the 10 s cap\n- **Fix:** use full jitter, `Math.random() * exp`. It is never negative and never over the cap.\n- **Also:** the tests pin `Math.random` to 0.5, so jitter is never tested\n\n───\n\n**The math.** The jitter is `(Math.random() - 0.5) * 1000`, a flat ±500 ms. It doesn't grow with the delay. With the defaults (`baseMs = 200`, `maxDelayMs = 10_000`):\n\n| attempt | backoff | final delay | chance ≤ 0 |\n|---|---|---|---|\n| 0 | 200 ms | −300 … 700 ms | **30%** |\n| 1 | 400 ms | −100 … 900 ms | **10%** |\n| 2 | 800 ms | 300 … 1300 ms | 0% |\n| ≥ 6 | 10 000 ms (cap) | 9500 … 10 500 ms | 0% |\n\n**Why negative delays hurt.** `setTimeout` treats any delay under 1 ms as 1 ms. So about 30% of failing sends retry almost at once, all together. That is the stampede jitter is meant to prevent. The default is `attempts = 3`, so only the sleeps after attempts 0 and 1 ever run. Those are exactly the two rows that go negative.\n\n**At the cap.** Delays can reach 10.5 s, which is past `maxDelayMs`. All clients also land in the same 1 s window around 10 s, so the spread is weak.\n\n**Suggested fix.** This is \"full jitter\": the delay is uniform in [0, exp). It can still be close to 0, but only rarely and spread evenly, with no pile-up at 1 ms. `JITTER_MS` goes away.\n\n```js\nexport function backoffDelay(attempt, { baseMs = 200, maxDelayMs = 10_000 } = {}) {\n  const exp = Math.min(maxDelayMs, baseMs * 2 ** attempt);\n  return Math.random() * exp;\n}\n```\n\nThe trade-off is that the average wait is half as long. If you want a minimum wait, use \"equal jitter\" instead: `exp / 2 + Math.random() * exp / 2`.\n\n**Tests.** `Math.random = () => 0.5` makes the jitter exactly 0 today (`test/retry.test.js:6`). After the fix, 0.5 gives `exp / 2`. The existing tests would still pass because they use `baseMs: 1`, but the \"no jitter\" comment would be wrong. There is no test for `backoffDelay` itself. Worth adding: with `Math.random` set to 0 and to 0.999, check the delay stays in [0, exp] and never goes over `maxDelayMs`.\n\n**Not verified by running.** My command to sample `backoffDelay` and run the tests was denied, so I didn't run anything. The numbers above are worked out by hand from the code.\n","lines":37,"tokens":714,"factsFull":4,"factsTop":3}}},{"id":"overview","prompt":"Give me an overview of this codebase for a new engineer.","facts":4,"answers":{"default":{"text":"# reminder-service: overview for a new engineer\n\n## The short version\n\nIt's a small Node 20 service with no dependencies. It stores reminders and is meant to deliver each one at the time the user picked. About 200 lines of code, one process, one small VM.\n\n**The running process does nothing useful yet.** `src/index.js:6` only starts the scheduler. Nothing calls the request handler `handle()` in `src/api.js`: there's no HTTP server or other front end. The database is an in-memory array inside the process, so nothing can add a reminder. The scheduler checks an empty table every 30 seconds. So far the code only runs for real in the tests.\n\n## How it runs\n\n```\nnpm start    # node src/index.js: reads config.json, starts the scheduler\nnpm test     # node --test test/\n```\n\nI didn't run the tests because the command needed approval in this session. So I can't tell you whether they pass.\n\n## How the pieces fit\n\n```\napi.handle(req) ──► db.query(sql) ◄── scheduler.tick() ──► retry.withRetry() ──► notify.send() ──► format.js / legacy.js ──► stdout\n```\n\n| File | Role |\n|---|---|\n| `src/index.js` | Entry point. Reads `config.json` and starts `setInterval(tick)`. |\n| `src/api.js` | A plain function: `{method, path, query, body}` in, `{status, body}` out. Four routes: create, list, search, delete. |\n| `src/db.js` | A fake SQL database. It uses regex to parse the few SQL statements the code sends and runs them against an in-memory array. It also logs every statement to `queryLog`, which the tests read. |\n| `src/scheduler.js` | Each tick it loads unsent rows, filters the due ones, sends each with retry, then sets `sent = 1`. |\n| `src/retry.js` | Exponential backoff with ±500 ms jitter. |\n| `src/notify.js` | Loads the formatter module named in `config.json` (`import(\\`./${name}.js\\`)`) and writes the result to `out`, which defaults to `console.log`. \"Delivery\" means a line on stdout. |\n| `src/format.js` / `src/legacy.js` | Two message formats: a readable sentence, and the old `REMIND\\|user\\|at\\|text` pipe format. |\n\nThe app code already talks SQL. Swapping `db.js` for a real database should mostly leave `api.js` and `scheduler.js` alone. That matters for issue 2 below.\n\n## Data model\n\nEach reminder has `id, user_id, text, at, tz_offset_min, due_ms, sent`.\n\n- `at` is the local time the user picked, as `YYYY-MM-DDTHH:mm`.\n- `tz_offset_min` is the user's UTC offset in minutes, east positive (IST is 330).\n- `due_ms` is the same moment as a **UTC** epoch in ms, worked out once at creation by `toUtcMs` (`src/api.js:7`).\n\nThe offset is fixed when the reminder is created, so daylight-saving changes after that aren't handled.\n\n## Config\n\n`config.json` has `tickSeconds` (30) and `formatter`. The formatter is set to `\"legacy\"`, not `\"format\"`.\n\n## Tests\n\nThe tests in `test/` cover `toUtcMs`, create/list/delete, `dueReminders` (only with offset 0), `withRetry` (jitter turned off by stubbing `Math.random`) and `send` (with the `format` formatter). Nothing tests search, `tick()`, overlapping ticks or the legacy formatter.\n\n## Bugs, most serious first\n\n1. **The timezone is applied twice. Reminders fire at the wrong time for anyone not on UTC.**\n   - `src/api.js:8` already turns local time into UTC for `due_ms`. Then `src/scheduler.js:9` subtracts the offset again.\n   - Result: IST reminders fire 5.5 hours early, and UTC−5 reminders fire 5 hours late.\n   - The comment at `src/scheduler.js:7` (\"due_ms is the user's wall-clock time\") is wrong. The README, `toUtcMs` and its test all say `due_ms` is UTC, so fix the scheduler, not the API.\n   - The tests miss it because every scheduler and create test uses offset 0.\n\n2. **Search builds its SQL by gluing strings together** (`src/api.js:30-31`).\n   - **Today:** the fake database splits conditions on the word \"AND\" (`src/db.js:29`). A normal search like `q=salt and pepper` is split in the middle of the text. The parser then throws \"unsupported condition\", and `handle()` doesn't catch it.\n   - **Later:** once a real database replaces `db.js`, which is the next planned job, this becomes a real SQL injection hole. Switch to `?` parameters like the other routes use.\n\n3. **Ticks can overlap and send the same reminder twice** (`src/scheduler.js:25-26`).\n   - `setInterval` starts a new tick every 30 seconds whether or not the last one has finished.\n   - A reminder that keeps failing takes about 3 seconds (5 attempts with backoff), and reminders are sent one at a time. About 10 failing reminders push a tick past 30 seconds.\n   - The next tick then reads the same unsent rows and sends them again.\n   - Fix: skip a tick while the previous one is still running, or use a `setTimeout` chain.\n\n4. **The live message format is the \"legacy\" one.**\n   - `config.json:3` selects `legacy`, even though the README calls `format.js` \"current\" and `legacy.js` has a \"remove this\" TODO.\n   - If someone deletes `legacy.js`, startup still succeeds. Every send then fails inside the retry loop and gets logged again on every tick, forever.\n   - Switch the config first, or check the formatter name at startup.\n\n## Smaller issues\n\n- `queryLog` (`src/db.js:8`) keeps every statement and is never cleared outside tests, so memory grows for as long as the process runs.\n- A badly formatted `at` makes `due_ms` NaN. The reminder is stored but never fires, with no error.\n- Jitter is a fixed ±500 ms, larger than the 200 ms first delay, so that delay can come out negative.\n- If the first query in `tick()` throws, the promise rejection isn't handled, and that crashes Node 20.\n- A reminder that always fails is retried every tick forever. There's no limit on attempts and no place to park failed ones.\n- Delete doesn't check who owns the reminder, and there's no auth anywhere.\n- `listReminders` crashes if `query` is missing from the request.\n\n## What's next: persistence\n\nThe README's main open item is that reminders must survive a restart. Its limits are Node 20, no dependencies, no new infrastructure, one process, and fewer than 5,000 rows.\n\n- Node's built-in `node:sqlite` doesn't exist in Node 20. As far as I know it arrived in Node 22.\n- On Node 20, the simplest fit is a JSON file, written to a temp file and then renamed over the old one so a crash can't corrupt it. 5,000 rows is small enough.\n- Node 20 also reached end-of-life in April 2026. Upgrading to a current LTS is worth raising, and it would make SQLite an option. I didn't check either date in this session.\n\n## Where to start\n\n1. Fix bug 1 and add a scheduler test with a non-zero offset.\n2. Parameterise search (bug 2).\n3. Add the overlap guard (bug 3).\n4. Then do persistence and wire `handle()` to an HTTP server, so the service actually takes reminders.\n","lines":101,"tokens":1914,"factsFull":4,"factsTop":0},"concise":{"text":"This is a small Node 20 service (ES modules, no dependencies) that stores reminders and prints them when they're due. It has two paths through the code. Several real bugs are hidden because every test uses a UTC offset of 0. I couldn't run the tests (`node` needed permission I don't have in this session), so everything below comes from reading the code.\n\n## How it works\n\n- **Write path:** `api.js` `handle(req)` → `db.query`. It has routes to create, list, search and delete reminders. Requests and responses are plain objects, not HTTP.\n- **Delivery path:** `index.js` reads `config.json` → `startScheduler` (`scheduler.js:25`) runs `tick` every 30s. `tick` selects unsent rows → `dueReminders` → `withRetry` (5 attempts, exponential backoff) → `notify.send`. `send` loads a formatter module by name from config and writes it to `console.log`.\n- **`db.js`** is an in-memory stand-in for a SQL database. It parses only the few statements the service uses with regexes, and logs every query to `queryLog` so tests can inspect them.\n- **Timestamps:** `at` is the user's local time, `tz_offset_min` is their offset (IST = 330), and `due_ms` is meant to be UTC (see the README table).\n\n**README constraints any change must respect:** one process on one VM, under 5,000 reminders, must survive restarts, no new infrastructure, no dependencies.\n\n## Known problems, most serious first\n\n1. **The time-zone offset is applied twice.** `toUtcMs` (`api.js:8`) already stores `due_ms` as UTC, then `dueReminders` (`scheduler.js:9`) subtracts the offset again. Example: 09:00 IST is stored as 03:30Z but fires at 22:00Z the day before, which is 5.5h early. Users with negative offsets get theirs late. `scheduler.test.js` only uses offset 0, so the tests pass anyway.\n2. **The API isn't connected to anything.** `index.js` only starts the scheduler, and there's no HTTP listener. Outside the tests nothing calls `handle`, so in production the scheduler checks an empty database.\n3. **Nothing is saved.** `db.js` keeps rows in memory, so they're lost on restart. The README already admits this; it's the obvious next project.\n4. **The search query is built by string concatenation** (`api.js:31`), and search has no tests. The fake database limits the damage today, but this becomes SQL injection once a real database replaces it. Also, there's no authentication anywhere: `userId` is whatever the caller sends, and delete (`api.js:35`) doesn't check who owns the reminder.\n5. **Overlapping ticks can send the same reminder twice.** `setInterval` (`scheduler.js:26`) starts a new `tick` without waiting for the last one, and reminders are sent one at a time. Each reminder that keeps failing spends about 3s in backoff on every tick, with no limit across ticks. About 10 of them push a tick past 30s. The next tick then reads the same unsent rows and sends them again.\n6. **The \"old\" message format is the one in use.** `config.json` and the default at `notify.js:14` both use `legacy`, even though the README calls `format.js` the current format. `legacy.js` has a TODO to remove it. Deleting it would break only at runtime, because formatters are loaded by name (`notify.js:8`): every send would fail and retry forever, and nothing would be delivered.\n7. **Minor:** the retry jitter is ±500ms, which is larger than the 200ms base delay (`retry.js:8`). The tests set `Math.random` to remove it, so this isn't tested.\n\n## Suggested reading order\n\n`README.md` → `src/index.js` → `src/scheduler.js` → `src/notify.js` → `src/api.js` → `src/db.js`. Then `test/`, keeping in mind that all of it assumes UTC.\n","lines":25,"tokens":1026,"factsFull":3,"factsTop":2},"skim":{"text":"**A one-process Node 20 reminder scheduler**: about 200 lines, no dependencies, and not production-ready yet.\n\n- **What runs:** `src/index.js:6` reads `config.json` (tick every **30s**, formatter `legacy`) and starts the scheduler. It does nothing else.\n- **No HTTP server:** `handle()` in `src/api.js:41` routes create/list/search/delete, but only the tests call it.\n- **Delivery:** on each tick, `scheduler.js:12` loads unsent rows, keeps the due ones, calls `send` with **5 attempts**, then sets `sent = 1`.\n- **Output:** `notify.js:14` loads the formatter named in config and `console.log`s the result. There is no real channel (SMS, email) yet.\n- **Storage:** `db.js` is a fake SQL engine that lives in memory. **Everything is lost on restart.** The README already lists this as the open item.\n- **Tests:** `npm test` runs 11 tests in 4 files. **I didn't run them** because the node command needed approval.\n\n**Also:**\n1. **Non-UTC users get reminders at the wrong time.** `due_ms` is already UTC (`api.js:8`, `README.md:37`), but `scheduler.js:9` subtracts the offset again. IST users get theirs **5h30m early**. Fix: `r.due_ms \u003c= nowMs`. The comment at `scheduler.js:7` is the wrong side.\n2. **A search containing \"and\" crashes.** `api.js:31` builds SQL by joining strings. For a search like \"milk and eggs\", `db.js:29` splits on \" AND \" (any case) and throws `unsupported condition`. Once db.js becomes a real database, this is SQL injection.\n3. **No auth:** anyone can list or delete any user's reminders by `userId` or `id`.\n4. **`legacy` is the live format** (`config.json:3`, and `notify.js:14` defaults to it too). Deleting it per the TODO at `legacy.js:2` breaks every send.\n5. **Risk of sending twice once sends go over a network.** `setInterval` doesn't wait for the last tick to finish. Each failing send spends about 3s in retries, so about 10 failures overrun a 30s tick.\n\n**Flow**\n```\nconfig.json ─> index.js ─> startScheduler: setInterval(tick, 30s)\n                                 │\n          tick(): SELECT * FROM reminders WHERE sent = 0   (db.js)\n                                 │\n                   dueReminders(rows, now)   ← bug #1 here\n                                 │\n       withRetry(send, 5 attempts, waits 200ms → 1.6s, ±500ms jitter)\n                                 │\n     notify.send: import(`./${formatter}.js`) → console.log(line)\n                                 │\n          UPDATE sent = 1        (on failure: stays unsent, next tick retries)\n\napi.handle({method, path, query, body}) → {status, body}   (tests only)\n```\n\n**Per-file notes**\n| File | Key exports | Know this |\n|---|---|---|\n| `db.js` | `query`, `reset` | Regex parsing; handles only `=`/`LIKE` joined by `AND` |\n| `retry.js` | `withRetry` | Delay `200·2^n`, max 10s |\n| `notify.js` | `send` | Formatter = a filename in `src/`: `legacy` or `format` |\n| `scheduler.js` | `tick`, `dueReminders` | First tick runs after 30s, not at startup |\n\n**Message formats**\n- `legacy`: `REMIND|u1|2026-03-01T09:00|call mum`\n- `format`: `Reminder for u1: call mum (set for 2026-03-01T09:00)`\n\n**Reminder row:** `id`, `user_id`, `text`, `at` (local `YYYY-MM-DDTHH:mm`), `tz_offset_min` (east is positive, IST = 330), `due_ms` (UTC epoch ms), `sent` (0 or 1).\n\n**Constraints from the README:**\n- One VM, one process, and no plan for a second.\n- About 2,000 reminders today, expected to stay under 5,000.\n- Must survive restarts.\n- No database server or queue without a strong reason, and no dependencies.\n\nAny replacement for `db.js` must keep the `query(sql, params)` and `reset()` interface, because the tests use it.\n\n**Minor:**\n- Offsets are fixed when a reminder is created, so reminders that cross a DST change arrive 1h off.\n- The `db.js:7` comment says tests use `queryLog`, but none do.\n- `startScheduler` never catches a rejected `tick()`, so if a future database throws during a query, Node 20 exits the process.\n- Bug #1 passes the tests because `scheduler.test.js` only uses `tz_offset_min: 0`.\n\n**Not verified:** every finding above comes from reading the code. I didn't execute any of it.\n","lines":63,"tokens":1170,"factsFull":3,"factsTop":2},"skim031":{"text":"**A single-process Node 20 reminder scheduler: 351 lines, no dependencies.**\n1. `src/index.js:6` reads `config.json` and starts a tick **every 30s**.\n2. Each tick (`src/scheduler.js:12`) loads rows with `sent = 0` and keeps the due ones. It sends each one with **up to 5 attempts**, then sets `sent = 1`.\n3. `src/notify.js:14` picks a formatter by name (config says `legacy`) and writes the message to **`console.log`**. Nothing else delivers it.\n4. **There is no HTTP server.** `api.handle` (`src/api.js:41`) is only called from tests, so the running service can't take in reminders.\n5. **Storage is in memory** (`src/db.js`), so a restart loses everything. The README's open item is making it persist, within these limits: one process, under 5k rows, no new infrastructure.\n\nRun it with `npm start` and test with `npm test`. **I did not run the tests**, because `node` needed approval. Everything here comes from reading the code.\n\n**Also:** bugs to know before you change anything:\n1. **Reminders fire at the wrong time outside UTC.** `api.js:16` already stores `due_ms` in UTC, and then `scheduler.js:9` subtracts the offset a second time. A 09:00 reminder in IST fires at 03:30 IST, **5.5h early**. US users get theirs late. The scheduler tests only use offset 0, so they can't catch this.\n2. **Search crashes on text containing \" and \".** `api.js:31` pastes the search term into the SQL string. `db.js:29` then splits on `AND` and throws `unsupported condition` (`db.js:18`).\n3. **SQL injection** on that same line (`api.js:31`). It becomes exploitable once `db.js` is replaced by a real database, which the persistence work implies.\n4. **Duplicate sends are possible.** `setInterval` (`scheduler.js:26`) doesn't wait for `tick` to finish. A failing send burns about 3s of backoff, so about 10 failures push a tick past 30s. The next tick then re-sends rows the first one hasn't marked yet.\n5. **No auth.** `userId` comes from the request, and `DELETE /reminders/:id` (`api.js:35`) deletes anyone's reminder.\n6. **Production uses the legacy format** (`config.json:3`, and the default at `notify.js:14`). The TODO at `legacy.js:2` says to remove that file. Removing it breaks delivery unless config first switches to `format`.\n7. Smaller issues:\n   - Fixed offsets ignore DST.\n   - A missing `tzOffsetMin` silently means UTC (`api.js:12`).\n   - An invalid `at` gives a `NaN` due time, so the reminder never fires.\n   - A failed reminder is retried every tick, forever.\n\n**Files**\n\n| File | Role | Watch out |\n|---|---|---|\n| `api.js` | 4 routes, plain `{method,path,query,body}` in, `{status,body}` out | not wired to any server |\n| `db.js` | fake SQL over an array | parses only the exact statements the service uses |\n| `scheduler.js` | finds due reminders, sends them, marks them sent | double offset (bug 1) |\n| `retry.js` | exponential backoff, 200ms base, ±500ms jitter | — |\n| `notify.js` | loads `./\u003cname>.js` dynamically, calls its `default` | name comes from config |\n| `format.js` / `legacy.js` | message text: sentence vs `REMIND\\|user\\|at\\|text` | — |\n\n**Routes** (`api.js:41-48`):\n- `POST /reminders` with body `{userId, text, at, tzOffsetMin}`\n- `GET /reminders?userId=`\n- `GET /reminders/search?userId=&q=`\n- `DELETE /reminders/:id`\n\n**Data model:** each row has `id, user_id, text, at, tz_offset_min, due_ms, sent`.\n- `at` is the user's local wall-clock time.\n- `due_ms` is the same moment as a UTC epoch in milliseconds (`README.md:31-37`).\n\n**`db.js` limits:**\n- It understands only `INSERT`, `SELECT *`, `UPDATE ... SET sent = 1` and `DELETE`, with `col = ?` or `LIKE` conditions joined by `AND`.\n- A new query shape needs new parsing code in `db.js:37-66`.\n- `queryLog` (`db.js:8`) records every statement, so tests can inspect them.\n\n**Tests:** 11 tests in 4 files, using `node:test`. These have no tests:\n- `tick` and `startScheduler`\n- search\n- a non-zero timezone offset in the scheduler\n- the `legacy` formatter\n","lines":54,"tokens":1127,"factsFull":4,"factsTop":1},"skim04":{"text":"**Create → store in memory → 30s tick → retry → print to stdout.**\n- **API not served:** `handle()` is a plain function. Nothing connects it to HTTP (`src/index.js:6`)\n- **Memory only:** all data is lost on restart, but the README says it must survive (`src/db.js:4`)\n- **Delivery stub:** \"sending\" means `console.log`, and the live format is legacy (`config.json:3`)\n- **Tests not run:** I wasn't given permission to run `node --test`, so nothing below was run\n- **Also:** time zones are converted twice, so IST reminders fire 5.5h early (`src/scheduler.js:9`)\n\n───\n\n**Ground rules from the README.** Every change has to fit these:\n- One VM, **one process**, and no plan for a second instance.\n- About **2,000** reminders today, expected to stay under **5,000**.\n- No new infrastructure (no database server, no queue) without a strong reason.\n- Node 20, ES modules, **zero dependencies**.\n\n**How it runs**\n\n```\nindex.js ── reads config.json ──> startScheduler(every 30s)\n                                       │\n                                       v\n                              tick(): SELECT sent = 0\n                                       │ dueReminders()\n                                       v\n                       withRetry(send, 5 attempts, exp backoff)\n                                       │\n                         ok ───────────┴────────── fail\n                          │                         │\n                  UPDATE sent = 1          log error; next tick retries\n\napi.js handle({method, path, query, body})   \u003c- not called by anything in src/\n  POST   /reminders         create (converts local time to UTC)\n  GET    /reminders         list by userId\n  GET    /reminders/search  text search\n  DELETE /reminders/:id\n```\n\n**What's real and what's a stub**\n\n| File | Status | Notes |\n|---|---|---|\n| `api.js` | logic is real, not served | only tests call it |\n| `db.js` | stand-in | parses only the SQL the service uses; `queryLog` is there for tests |\n| `scheduler.js` | real | `setInterval` loop |\n| `retry.js` | real | base 200ms, doubles each time, ±500ms jitter |\n| `notify.js` | stub output | loads the formatter by name from config |\n| `format.js` / `legacy.js` | real | prod uses `legacy` (pipe format); legacy has a TODO to remove it |\n\n**Gotchas, worst first** (all found by reading the code, none observed running)\n\n1. **Time zones converted twice.** `toUtcMs` already stores `due_ms` as UTC (`src/api.js:8`). Then `dueReminders` subtracts `tz_offset_min` again (`src/scheduler.js:9`). The comment on line 7 says `due_ms` is wall-clock time, which contradicts both the README and `api.js`.\n   - An IST user picks 09:00. The stored time is 03:30Z, but the reminder fires at 22:00Z the day before (03:30 IST), **5.5h early**.\n   - An offset of −300 fires **5h late**.\n   - The tests miss it because the scheduler test only uses offset 0 (`test/scheduler.test.js:6`). The create test also uses the default offset of 0 (`test/api.test.js:17-20`).\n\n2. **Search SQL is built by joining strings** (`src/api.js:31`).\n   - It breaks today: searching \"bread and butter\" throws. The fake parser splits conditions on `AND` (`src/db.js:29`) and then hits `unsupported condition`. `handle()` has no try/catch, so the error reaches the caller.\n   - It becomes real SQL injection once `db.js` is swapped for a real database. List and create already use `?` params; search should too.\n\n3. **Ticks can overlap.** `setInterval` (`src/scheduler.js:26`) doesn't wait for the async `tick` to finish. Each failing reminder sleeps about 3s across its retries (200+400+800+1600ms). So about 10 failing reminders push one tick past 30s. The next tick then re-selects rows that are still being sent, which can send them twice.\n\n4. **Smaller gaps:**\n   - **No auth:** `userId` comes from the client, so anyone can list or delete any user's reminders.\n   - **Bad dates accepted:** an invalid `at` gives `due_ms = NaN`. Create returns 201, but the reminder never fires.\n   - **No DST:** the offset is fixed when the reminder is created.\n   - **Uncaught tick errors:** the promise from `tick()` in `startScheduler` is never caught. A DB error there becomes an unhandled rejection.\n   - **Fragile config:** `formatter` is a module name that `notify.js` imports dynamically. A typo, or a name like `\"db\"`, fails on every send.\n\n**Commands** (from the README)\n\n```\nnode src/index.js     # start the scheduler\nnode --test test/     # run the tests\n```\n\nThe tests cover `toUtcMs`, the API happy paths, `withRetry` and the `format` formatter. They don't cover `tick()`, non-zero offsets in the scheduler, search, or the `legacy` formatter.\n","lines":77,"tokens":1325,"factsFull":4,"factsTop":1}}},{"id":"test-gaps","prompt":"Where are the test coverage gaps? Which ones matter most?","facts":4,"answers":{"default":{"text":"Your 9 tests cover the easy paths. The three things most likely to hurt users have no tests at all: the code that actually sends reminders, the search route, and anything with a timezone other than UTC.\n\nI couldn't run anything because `node` needed approval, so this comes from reading all 351 lines. The test cases below are worked out by hand and haven't been run.\n\n## Why passing tests prove little here\n\nEach test avoids the setup production actually uses:\n- **Scheduler tests** use only `tz_offset_min: 0`, so any mistake in timezone handling cancels out.\n- **The notify test** uses the `'format'` formatter, but production uses `'legacy'` (`config.json` and the default in `notify.js:14`).\n- **The retry tests** fix `Math.random` at 0.5, so the random part of the retry delay is never tested.\n- **Nothing tests across modules.** No test creates a reminder through the API and then checks when the scheduler sends it.\n\n## Ranked by what matters\n\n**1. Reminders fire at the wrong time for every user outside UTC.**\n- The reminder time is converted to UTC when it's saved (`src/api.js:8`), then converted again when checking if it's due (`src/scheduler.js:9`).\n- An IST user who sets 09:00 gets the reminder at 03:30 IST, 5.5 hours early. US users get theirs hours late.\n- The scheduler is the side to fix. The README, `toUtcMs` and its test all agree the saved time is already UTC, and the comment at `scheduler.js:7` is out of date.\n- Test that fails today: create `{at:'2026-03-01T09:00', tzOffsetMin:330}`, then check that `dueReminders(rows, Date.parse('2026-03-01T03:29:59Z'))` returns no reminders. It returns one.\n\n**2. The search route has no tests, and it's the only query built by pasting user input into SQL (`src/api.js:30-31`).**\n- **Today:** searching for `'milk and eggs'` makes `handle()` throw. The in-memory database splits the query on `AND`, including the `and` inside the search text.\n- **After the move to a real database** (the README's open item, since data must survive restarts): this is SQL injection, and an apostrophe in a search becomes a syntax error.\n- The right test sends a request through `handle()` and checks `queryLog`. The user's text should be passed as a parameter, never pasted into the SQL. `db.js:7` says `queryLog` exists for exactly this, but no test uses it. A test like that will still work after the database is replaced.\n\n**3. The code that actually sends reminders (`tick()`) is untested.**\n- `legacy.js` says \"TODO: remove\" and nothing imports it directly, only by name from config. Deleting it would leave every test passing and stop all deliveries without any visible error. Each send would fail, retry five times, log a line, and repeat every tick.\n- Nothing checks that a reminder is marked sent and not sent again on the next tick.\n- This is probably why `tick()` has no tests: it hardcodes `{ attempts: 5 }` and doesn't let callers change the retry settings (`scheduler.js:16`). Any test where a send fails would wait about 3 seconds of real retry delay. Letting callers pass the retry settings in, or using `mock.timers`, would make those tests easy to write.\n\n**4. Medium priority**\n- **Bad input is accepted and then never fires.** For example `tzOffsetMin: '+05:30'`, or an `at` that isn't a valid date: the saved time becomes `NaN`, the API returns 201, and the reminder is never due.\n- **Missing query crashes.** A GET to `/reminders` or `/reminders/search` with no query object throws a TypeError at `q.userId`.\n- **Duplicate sends.** `setInterval` doesn't wait for the previous tick to finish. If sends are slow or failing (about 10 failing reminders in one tick is enough), two ticks run at once and both send the same reminders. This only shows up once sending goes over a real network.\n\n**5. Low priority**\n- The random part of the retry delay is fixed at ±500 ms, so the delay can be negative on the first attempt or go over the 10-second cap.\n- `index.js` and loading `config.json` are untested.\n- Anyone can list or delete any user's reminders. That's a missing permission check in the design rather than a test gap.\n\n**Question:** the README calls `format.js` the \"current message format\", but production uses `legacy`. Is that on purpose?\n\n**Suggested order:** since moving to a real database is the next change, start with tests that go through `handle()` and `tick()` and check results via `queryLog`. They'll keep working when `db.js` is rewritten. If you allow `node` to run, I can add the three failing tests (items 1–3) and confirm they fail for the reasons above.\n","lines":44,"tokens":1300,"factsFull":4,"factsTop":3},"concise":{"text":"The biggest gap isn't a missing test. It's a weak one. `dueReminders` has tests, but they only use `tz_offset_min: 0`, which hides a bug that makes every non-UTC reminder fire at the wrong time. Here are the gaps, ranked by what a realistic test would catch today:\n\n1. **The timezone offset is applied twice (`src/scheduler.js:9`).** `due_ms` is already UTC (`toUtcMs` at `src/api.js:16`, and the README says so). `dueReminders` then subtracts the offset again.\n   - A 09:00 IST reminder (offset 330) is stored as 03:30Z but fires at 22:00Z the day before, 5.5h early.\n   - US users get theirs late: 5h late for EST.\n   - Both test files pass because each checks only its own side, at offset 0.\n   - **Missing test:** create a reminder through `handle` with `tzOffsetMin: 330`. `dueReminders` should return nothing at 03:29Z and one reminder at 03:30Z.\n\n2. **Search has zero tests and builds SQL by joining strings (`src/api.js:30-31`).**\n   - Searching \"bread and milk\" throws today. The fake DB splits on `AND` and can't parse the leftover `text LIKE '%bread`.\n   - Once `db.js` becomes a real store (the README requires surviving restarts), it's SQL injection: `userId=x' OR '1'='1` returns every user's reminders.\n   - `db.queryLog` exists for exactly this kind of check, but no test uses it.\n   - **Missing tests:** search text containing \"and\" or an apostrophe, plus a check that the values arrive in `params`.\n\n3. **`tick()` and `startScheduler` have no tests (`src/scheduler.js:12-27`).**\n   - Nothing checks that a successful send marks the row sent, or that a failed send stays unsent for the next tick.\n   - **Duplicate sends:** `setInterval` doesn't wait for the async `tick`. Each failing reminder spends about 3s in backoff (5 attempts), so about 10 failures push a tick past 30s. The next tick then re-reads rows that aren't marked yet and sends them a second time. Running a single process doesn't prevent this.\n\n4. **The formatter production actually uses is untested.** `config.json` and `send`'s default both use `legacy`, but the only notify test uses `format`. A typo in the formatter name makes every send fail, retry 5 times and log an error each tick. Delivery stops, and no test or startup check catches it.\n\n5. **A malformed `at` is accepted (`src/api.js:16`).** A value with seconds (`2026-03-01T09:00:00`) or plain garbage gives `due_ms = NaN`. The API still returns 201, and the reminder never fires. Only missing-field validation is tested.\n\n**Lower priority:**\n- The retry tests pin `Math.random` to 0.5, so jitter never runs. The fixed ±500ms on a 200ms base can go negative, which is harmless because `setTimeout` treats it as 0.\n- `index.js` is untested.\n- Delete doesn't check who owns the reminder, though there's no auth yet.\n- Nothing tests surviving a restart, but that feature doesn't exist yet.\n\nRunning the suite needed your approval, so I didn't run it. These findings come from reading the code and tracing it by hand. I can write the tests for items 1–3; I expect those for 1 and 2 to fail against the current code.\n","lines":30,"tokens":875,"factsFull":4,"factsTop":2},"skim":{"text":"**6 gaps.** The worst hides a live bug: **non-UTC reminders fire at the wrong time.**\n**Not run:** `node --test` needed approval, so I didn't run the suite. Everything here comes from reading the code, and I traced bugs 1–3 by hand.\n\n1. **Timezone (live bug).** `scheduler.js:9` subtracts the offset a second time, after `api.js:8` already did. IST fires **5.5h early**, US-Eastern **5h late**. Tests miss it because `scheduler.test.js:6` sets `tz_offset_min: 0`.\n2. **Search has no tests and crashes today.** `api.js:31` builds SQL by string concatenation. Searching \"milk and eggs\" throws out of `handle()`.\n3. **Bad `at` is accepted.** `\"2026-03-01T09:00:00\"` becomes NaN `due_ms`. It still returns **201** and never fires (`api.js:13`).\n4. **The production formatter has no tests.** `config.json:3` uses `legacy`, but the only test uses `format` (`notify.test.js:8`).\n5. **`tick()` has no tests.** Nothing checks that `sent = 1` is written, the failure path, or overlapping ticks (`scheduler.js:12-27`).\n6. Low: `backoffDelay` is never tested, and the tests turn jitter off (`retry.test.js:6`).\n\n**1. Timezone.** README:37 says `due_ms` is already UTC, so the scheduler is the side that's wrong (its comment at `scheduler.js:7` is wrong too).\n- Trace: 09:00 IST is stored as 03:30Z. The scheduler then compares against 22:00Z the previous day, so the reminder fires at 03:30 IST.\n- Test to add: create through `handle()` with `tzOffsetMin: 330`. Run `dueReminders` on the stored row at 03:29Z (expect 0) and 03:30Z (expect 1).\n- Fix: `r.due_ms \u003c= nowMs`. Stored rows are already correct, so no data migration is needed.\n\n**2. Search.** `db.js:29` splits the WHERE clause on `/\\s+AND\\s+/i`. So \"milk and eggs\" produces the condition `text LIKE '%milk`, which throws `unsupported condition`. `handle()` has no try/catch.\n- Injection: the stub's parser returns nothing for `x' OR '1'='1`, so a behavior test would pass. Once `db.js` becomes a real database (README:16 requires surviving restarts), that payload would return every user's reminders.\n- Test to add: `queryLog` (`db.js:8`) was built for this and no test uses it. Assert that the search SQL uses `?` and user input appears only in `params`. Also assert that \"milk and eggs\" returns 200.\n\n**3. Validation.** `api.js:13` only checks that fields are present.\n- Seconds in `at` give `...T09:00:00:00Z`, which parses to NaN. `NaN \u003c= now` is false forever. `tzOffsetMin: \"IST\"` fails the same way.\n- Test to add: a bad `at` should return 400.\n\n**4. Legacy formatter.** `legacy.js:2` has a TODO to delete it. But `config.json:3` and the default at `notify.js:14` both still pick it.\n- If someone deletes it as the TODO says, **every production send** fails in `import()` and is only logged. No test would fail, because `tick` is untested too.\n- A `|` in the reminder text also corrupts the pipe-delimited output.\n- Tests to add: `send` with `formatter: 'legacy'`, and a check that the formatter named in config loads.\n\n**5. `tick()`.** Delivery is `console.log` today, so sends rarely fail or run slow. The overlap problem only bites once real delivery exists.\n- Overlap: `setInterval` (`scheduler.js:26`) doesn't wait for the previous tick. Each failing reminder takes about 3s of retries, so about 10 failures push a tick past 30s. The next tick then selects the same unsent rows and sends them again.\n- The SELECT at `scheduler.js:13` is outside the try, and the promise is dropped. With a real database, one query error becomes an unhandled rejection, which **exits the process** on Node 20.\n- Tests to add: tick marks reminders sent; a failing send stays unsent; two concurrent ticks send each reminder once.\n\n**6. Backoff.** Jitter is a fixed ±500ms (`retry.js:4,8`). That makes the first delay as low as −300ms and lets delays exceed `maxDelayMs` by up to 500ms. This matters little with one process.\n\n| File | Tested | Not tested |\n|---|---|---|\n| `api.js` | toUtcMs, create (offset 0), list, delete | search, validation, 404 route |\n| `scheduler.js` | dueReminders (offset 0) | tick, startScheduler |\n| `notify.js` | send with `format` | `legacy`, bad formatter name |\n| `retry.js` | withRetry | backoffDelay |\n| `index.js`, `legacy.js` | nothing | everything |\n\n**Also:**\n- Delete has no ownership check (`api.js:35-38`), so any caller can delete any id. There's no auth model to test this against yet.\n- Restarts lose all data (README:16 already says so), and no test covers it.\n- `tz_offset_min` is captured when the reminder is created. A reminder that crosses a DST change fires 1h off. IST has no DST.\n","lines":48,"tokens":1307,"factsFull":4,"factsTop":3},"skim031":{"text":"**Biggest gap: nothing tests create → `tick` → deliver**, and it hides a real timezone bug. Ranked, most important first:\n\n1. **Timezone applied twice.** `api.js:8` already converts to UTC, then `scheduler.js:9` subtracts `tz_offset_min` again. IST reminders fire **5.5h early** and US Eastern (-300) fires **5h late**. Scheduler tests only use offset 0 (`scheduler.test.js:6`), so they can't catch it.\n2. **`tick()` has no tests** (`scheduler.js:12`). Nothing checks mark-as-sent, retry on the next tick, or no double send. Ticks can overlap (`:26`) and send the same reminder twice.\n3. **Search has zero tests** and builds SQL by string concatenation (`api.js:31`). A search for \"milk and eggs\" would throw, and a quote in the input is SQL injection once a real DB arrives.\n4. **The production formatter is untested.** `config.json:3` uses `legacy`, but tests only use `format`. Deleting `legacy.js`, as its own TODO says, would make every send fail with no test going red.\n5. **An invalid `at` is accepted.** It returns 201 with `due_ms = NaN`, and the reminder is never delivered (`api.js:16`).\n6. **Jitter is never exercised.** `retry.test.js:6` pins `Math.random` to 0.5. The first retry delay can go negative (200 − 500ms).\n\n**Not run:** the node commands needed approval, so I have no coverage numbers and haven't confirmed the current tests pass. You can run `node --test --experimental-test-coverage test/`.\n\n**One test covers 1, 2 and 4.** It fails today on the first assert:\n\n```js\ntest('IST reminder is delivered once, at 09:00 local', async () => {\n  reset();\n  handle({ method: 'POST', path: '/reminders',\n    body: { userId: 'u1', text: 'call mum', at: '2026-03-01T09:00', tzOffsetMin: 330 } });\n  const lines = [];\n  const opts = { formatter: config.formatter, out: (l) => lines.push(l) }; // config.json\n  await tick(Date.parse('2026-03-01T03:29:00Z'), opts);\n  assert.equal(lines.length, 0);\n  await tick(Date.parse('2026-03-01T03:30:00Z'), opts);\n  assert.equal(lines.length, 1);\n  await tick(Date.parse('2026-03-01T03:31:00Z'), opts);\n  assert.equal(lines.length, 1); // not sent twice\n});\n```\n\n**1. Which side is wrong.** `README.md:37` says `due_ms` is already a UTC epoch, and `toUtcMs` agrees. Only the comment at `scheduler.js:7` disagrees. So the fix is `r.due_ms \u003c= nowMs` at `scheduler.js:9`, not a change to `toUtcMs`.\n\n**2. Duplicate sends.** Each failing send waits about **3s** in backoff (200+400+800+1600ms). During a notifier outage, about 10 failing reminders make one tick outlast the 30s interval. `setInterval` doesn't wait for the previous tick, so the next tick reads the same unsent rows. Meanwhile the old tick keeps working through its stale copy of the rows, so both ticks send them.\n- Testability: `tick` hardcodes `{ attempts: 5 }` (`scheduler.js:16`), so any failure-path test waits ~3s in real time. Use `mock.timers` from `node:test`, or let `tick` accept retry options.\n\n**3. Search.** The in-memory DB splits the WHERE clause on `AND` without regard to case (`db.js:29`), so \"milk and eggs\" would throw `unsupported condition`.\n- `handle` has no try/catch (`api.js:41`), so the error escapes instead of becoming a 4xx/5xx.\n- List and search also throw if `req.query` is missing (`api.js:25`, `:31`).\n- Once persistence moves to a real DB, `' OR '1'='1` returns every user's reminders.\n- Fix: `query('SELECT * FROM reminders WHERE user_id = ? AND text LIKE ?', [q.userId, `%${q.q}%`])`.\n\n**4. Formatter.** An unknown or deleted formatter makes `import()` reject. Each reminder then retries 5 times per tick, every tick, forever. `index.js:6` doesn't check the formatter at startup.\n\n**Also:**\n- `DELETE /reminders/:id` has no ownership check (`api.js:36`), so any caller can delete any reminder.\n- `config.json` still uses `legacy`, though `format.js` is labeled the current format.\n- Surviving restarts (`README.md:16`) has no test, but it isn't built yet either.\n","lines":47,"tokens":1119,"factsFull":4,"factsTop":4},"skim04":{"text":"**5 gaps matter; the worst hides a live timezone bug.** I found these by reading the code. I could not run the tests because Bash approval was denied.\n\n- ⛔ **Timezones:** no test uses a nonzero offset; IST fires 5.5h early (`scheduler.js:9`)\n- ⛔ **Search:** no tests; \"milk and eggs\" throws, and SQL is built from strings (`api.js:31`)\n- ⚠ **Bad `at`:** no validation test; a NaN time returns 201 and never fires (`api.js:13`)\n- ⚠ **tick():** no tests; ticks can overlap and send twice, but not yet (`scheduler.js:26`)\n- ⚠ **Shipped format:** config uses `legacy`, but only `format` is tested (`config.json:3`)\n\n───\n\n**1. Timezones** (`scheduler.js:9`)\n\nThe only fixture sets `due_ms` by hand with `tz_offset_min: 0`, so subtracting the offset changes nothing. But `due_ms` is already UTC (`api.js:16`, README), and the scheduler subtracts the offset a second time. So a 09:00 IST (330) reminder fires at 03:30 local, 5.5h early. US Eastern (−300) fires 5h late. Every non-UTC user is affected.\n\nThe comment at `scheduler.js:7` is wrong and contradicts the README. Don't change the test to match it.\n\nTest: build the reminder through `create`, not by hand.\n```js\nconst { body } = create({ userId: 'u1', text: 'x', at: '2026-03-01T09:00', tzOffsetMin: 330 });\nassert.equal(dueReminders([body], Date.parse('2026-03-01T03:29:00Z')).length, 0);\nassert.equal(dueReminders([body], Date.parse('2026-03-01T03:30:00Z')).length, 1);\n```\nFix: `r.due_ms \u003c= nowMs`.\n\n**2. Search** (`api.js:29`)\n\nNo test calls `/reminders/search`.\n\nWhat breaks today:\n- The fake DB splits WHERE on `AND`, ignoring case (`db.js:29`). So \"milk and eggs\" leaves a condition with no closing quote. `matcher` throws `unsupported condition`, and `handle` doesn't catch it.\n- If `q` is missing, it searches for the literal text \"undefined\".\n- A `%` typed by the user works as a wildcard.\n\nAfter the DB swap: the README says the service must survive restarts, so a real DB is likely. Then this becomes SQL injection. `q = \"%' OR user_id LIKE '%\"` would return every user's reminders.\n\nTests: a term with \"and\", a term with `'`, a missing `q`, and a check that other users' rows never come back.\nFix: `query('... WHERE user_id = ? AND text LIKE ?', [q.userId, `%${q.q}%`])`. Parameters skip the AND split, so this also fixes the crash.\n\n**3. Bad `at`** (`api.js:13`)\n\nThe only test is for a missing field. `toUtcMs` appends `:00Z`, so an `at` that includes seconds (`2026-03-01T09:00:00`) or any non-ISO string gives `NaN`. `NaN \u003c= nowMs` is always false. The API returns 201 and the reminder never fires. `tzOffsetMin: \"+05:30\"` does the same.\n\nTest: a POST with seconds in `at` should get 400.\nFix: reject when `Number.isNaN(dueMs)`, and require an integer offset from −720 to 840.\n\n**4. tick()** (`scheduler.js:12`)\n\n`tick` and `startScheduler` have no tests. Nothing checks that a sent reminder gets `sent = 1`, that a failed one stays unsent, or that ticks don't overlap.\n\nThis can't happen today, because delivery is `console.log`. Once delivery is a network call:\n- Each failing send takes about 3s: 5 attempts with 200+400+800+1600 ms of backoff.\n- About 10 failures push a tick past 30s. `setInterval` then starts the next tick anyway.\n- The new tick picks up rows the old one hasn't marked yet, so both send them.\n- A reminder that always fails is retried on every tick forever. There's no attempt cap and no dead-letter, and it delays every reminder behind it.\n\nTests:\n- `tick(now, { out })` sends once and sets `sent = 1`.\n- A throwing `out` leaves the reminder unsent. `tick` hardcodes `{ attempts: 5 }`, so let it accept retry options or this test waits about 3s.\n- `Promise.all([tick(), tick()])` sends each reminder once. This should fail now: both ticks select before either one marks the row.\n\nFix: skip a tick while one is still running, or schedule the next tick with `setTimeout` after the current one ends.\n\n**5. Shipped format** (`config.json:3`)\n\nThe README calls `format.js` \"current\" and `legacy.js` \"old\". The test covers only `format`. Both config and `notify.js:14` default to `legacy`, so the format that actually ships has no test.\n- `legacy` joins fields with `|` and doesn't escape them. A reminder text containing `|` makes the line ambiguous for whatever parses it.\n- A typo in the config's formatter name makes every send fail. Those sends retry forever, and the only signal is a log line.\n\nTests: a fixed expected output for `legacy`, text containing `|`, and an unknown formatter name.\n\n**Lower priority**\n\n| Gap | Where | Risk |\n|---|---|---|\n| Jitter never exercised (`Math.random` pinned to 0.5) | `retry.js:8` | Delay can go negative or exceed `maxDelayMs` by 500 ms |\n| `list` called with no `query` | `api.js:25` | Throws TypeError; a missing `userId` returns `[]` |\n| `delete` has no ownership check | `api.js:37` | Anyone can delete any id; no test checks other rows survive |\n| `index.js` config wiring | `index.js:6` | Untested; low risk |\n| Persistence | `db.js:4` | README requires surviving restarts; not built, not tested |\n","lines":80,"tokens":1439,"factsFull":4,"factsTop":3}}}]};
const cols = DATA.columns, qs = DATA.questions;
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let qi = store.get('qi', 0), view = 'side', blind = false, tab = 0;
const hidden = new Set(store.get('hidden', []));
const picks = store.get('picks', {});
